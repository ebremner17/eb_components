$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Image + HTML'
description: 'An image paired with free-form HTML content, with the image placed on the left, right, top, or bottom.'
props:
  type: object
  properties:
    title:
      type: string
      title: Title
      description: 'Optional title shown above the image and HTML content. Leave blank to hide it.'
    heading_level:
      type: string
      title: 'Heading level'
      description: 'The HTML heading tag used for the title.'
      enum:
        - h2
        - h3
        - h4
        - h5
      meta:enum:
        h2: 'H2'
        h3: 'H3'
        h4: 'H4'
        h5: 'H5'
      default: h3
      examples:
        - h3
    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Image
      description: 'Optional image to pair with the HTML content.'
      examples:
        - src: 'https://placehold.co/600x400'
          alt: ''
          width: 600
          height: 400
    image_position:
      type: string
      title: 'Image position'
      description: 'Where to place the image relative to the HTML content. Left and right split the space evenly.'
      enum:
        - left
        - right
        - top
        - bottom
      meta:enum:
        left: Left
        right: Right
        top: Top
        bottom: Bottom
      default: left
      examples:
        - left
    html:
      type: string
      title: 'HTML content'
      description: 'Free-form HTML.'
      contentMediaType: text/html
      x-formatting-context: block
      x-eb-raw-html: true
    caption:
      type: string
      title: Caption
      description: 'Optional caption shown below the image, with a black background and white text. Leave blank to hide it.'
    caption_alignment:
      type: string
      title: 'Caption alignment'
      description: 'How the caption text is aligned.'
      enum:
        - left
        - right
        - center
      meta:enum:
        left: Left
        right: Right
        center: Center
      default: left
      examples:
        - left
