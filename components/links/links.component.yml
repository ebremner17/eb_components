$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Links
description: 'Optional before/after text wrapped around an unlimited list of Link components.'
props:
  type: object
  properties:
    section_title:
      type: string
      title: 'Section title'
      description: 'Optional title shown above the list of links. Leave blank to hide it.'
    heading_level:
      type: string
      title: 'Heading level'
      description: 'The HTML heading tag used for the section title.'
      enum:
        - h2
        - h3
        - h4
        - h5
      meta:enum:
        h2: 'H2'
        h3: 'H3'
        h4: 'H4'
        h5: 'H5'
      default: h3
      examples:
        - h3
    before_text:
      type: string
      title: 'Before text'
      description: 'Optional text shown above the list of links.'
      examples:
        - 'Related resources:'
    after_text:
      type: string
      title: 'After text'
      description: 'Optional text shown below the list of links.'
      examples:
        - 'Contact us if you have questions.'
slots:
  links:
    title: Links
    description: 'Add one or more Link components here.'
