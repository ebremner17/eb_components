$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Card
description: 'A card with an image, heading, body text, and an optional link.'
props:
  type: object
  required:
    - heading
  properties:
    heading:
      type: string
      title: Heading
      description: 'The card heading.'
      examples:
        - 'Card heading'
    body:
      type: string
      title: Body
      description: 'The card body text.'
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - '<p>Card body text.</p>'
    image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Image
      description: 'An optional image shown above the heading.'
      examples:
        - src: 'https://placehold.co/600x400'
          alt: ''
          width: 600
          height: 400
    link_url:
      type: string
      title: 'Link URL'
      description: 'An optional link, internal or external.'
      format: uri-reference
      examples:
        - /about
    link_text:
      type: string
      title: 'Link text'
      examples:
        - 'Learn more'
