$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: 'Hero Slideshow'
description: 'A full-width hero slideshow that crossfades through up to 12 images, in the order given.'
props:
  type: object
  required:
    - images
  properties:
    images:
      type: array
      title: Images
      description: 'Up to 12 images, shown in the order given.'
      minItems: 1
      maxItems: 12
      items:
        $ref: json-schema-definitions://canvas.module/image
        type: object
      examples:
        -
          - src: 'https://placehold.co/1600x900?text=Slide+1'
            alt: ''
            width: 1600
            height: 900
          - src: 'https://placehold.co/1600x900?text=Slide+2'
            alt: ''
            width: 1600
            height: 900
    slide_speed:
      type: integer
      title: 'Slide speed (ms)'
      description: 'How long each image is displayed for, in milliseconds.'
      default: 4000
      minimum: 500
      examples:
        - 4000
    transition_speed:
      type: integer
      title: 'Transition speed (ms)'
      description: 'How long the crossfade transition takes, in milliseconds.'
      default: 400
      minimum: 0
      examples:
        - 400
libraryOverrides:
  dependencies:
    - core/once
