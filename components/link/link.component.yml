$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Link
description: 'A single link with a required URL, an optional title, and an optional description. Used inside the Links component.'
props:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      title: Link
      description: 'The internal or external link URL.'
      format: uri-reference
      examples:
        - /about
    title:
      type: string
      title: Title
      description: 'Optional link text. If left blank, the URL is shown instead.'
      examples:
        - 'Learn more'
    description:
      type: string
      title: Description
      description: 'Optional description shown beneath the link.'
      examples:
        - 'A short summary of this link.'
